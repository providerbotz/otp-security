services:
  - type: web
    name: otp-bomber-api
    runtime: python
    repo: https://github.com/providerbotz/otp-security
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: RENDER
        value: true
    healthCheckPath: /
    autoDeploy: true
